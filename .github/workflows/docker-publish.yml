name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: casualcaleb/garage-sentinel

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/casualcaleb/garage-sentinel:latest
            ghcr.io/casualcaleb/garage-sentinel:${{ github.sha }}

deploy:
  needs: build
  runs-on: [self-hosted, linux]

  permissions:
    contents: read
    packages: read

  steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull latest image
      run: docker pull ghcr.io/casualcaleb/garage-sentinel:latest

    - name: Replace running container
      run: |
        docker rm -f garage-sentinel || true

        docker run -d \
          --name garage-sentinel \
          --restart unless-stopped \
          -p 8000:8000 \
          ghcr.io/casualcaleb/garage-sentinel:latest